<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title"></title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="/css/login-registration.css">


    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-auth.js"></script>

</head>
<body>
    <nav class="flex-div">
        <div class="nav-left flex-div">
            <img src="images/menu.png" class="menu-icon">
            <a href="/index.html"><img src="images/marakischool.jpg" class="logo"></a>

        </div>
        <div class="nav-middle flex-div">
          <div class="sliding-text">
            ከኬጂ - 12ኛ ክፍል የተመረጡ ቪዲዮዎች! አሁኑኑ ይቀላቀሉ! ☆ Carefully Selected Videos From KG - Grade 12. Join Us Now!
          </div>
            <div class="search-box flex-div">
                <input type="text" id="searchBar" placeholder="Search" />
                <!-- Search Results Dropdown -->
                <div id="searchResults" class="results-dropdown">
                    <ul id="resultsList"></ul>
                </div>
            </div>
        </div>


        <div class="nav-right flex-div">
            <button  class="btn"  id="joinUs">Join Us!</button>
            <span id="nickName"></span>
            <img src="images/user-icon.png" id="userIcon">
            <div class="dropdown-menu" id="dropdownMenu">
                <button id="profile">Profile</button>
                <button id="signOut">Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar">
        <div id="sidebarContent"></div>
        <div class="signin-signup">
            <div class="container-register" id="signup" style="display:none;">
                <h1 class="form-title">Register</h1>
                <form method="post" action="">
                  <div id="signUpMessage" class="messageDiv" style="display:none;"></div>
                  <div class="input-group">
                     <i class="fas fa-user"></i>
                     <input type="text"  id="nickNameText" placeholder="User Name" required>


                  </div>

                  <div class="input-group">
                      <i class="fas fa-envelope"></i>
                      <input type="email"  id="rEmail" placeholder="Email" required>

                  </div>
                  <div class="input-group">
                      <i class="fas fa-lock"></i>
                      <input type="password" id="rPassword"  placeholder="Password" required>

                  </div>
                  <div class="grade-dropdown">

                    <select id="gradeSelect" onchange="getSelectedKey()">
                        <option value="" disabled selected>Select a Grade</option>
                    </select>
                </div>

                 <button class="btn" id="submitSignUp" >Sign Up</button>
                </form>
                <!-- <p class="or">
                  ----------or--------
                </p>
                <div class="icons">
                  <i class="fab fa-google"></i>
                  <i class="fab fa-facebook"></i>
                </div> -->
                <div class="links">
                  <p>Already Have Account ?</p>
                  <button id="signInButton">Sign In</button>
                </div>
              </div>

            <div class="container-register" id="signIn">
                  <h1 class="form-title">Sign In</h1>
                  <form method="post" action="">
                    <div id="signInMessage" class="messageDiv" style="display:none;"></div>

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email"  id="email" placeholder="Email" required>

                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                      <input type="password" id="password"  placeholder="Password" required>

                    </div>
                    <p class="recover">
                      <a href="#">Recover Password</a>
                    </p>
                   <button  class="btn"  id="submitSignIn">Sign In</button>
                  </form>
                  <!-- <p class="or">
                    ----------or--------
                  </p>
                  <div class="icons">
                    <i class="fab fa-google" id="googleSignInButton"></i>
                    <i class="fab fa-facebook"></i>
                  </div> -->
                  <div class="links">
                    <p>Don't have account yet?</p>
                    <button id="signUpButton">Sign Up</button>
                  </div>
                </div>
        </div>

    </div>

    <!-- Main content -->
    <div class="container">
        <div class="list-container">
            <!-- Video list will be dynamically populated here -->
        </div>
        <div id="welcomeMessage">Welcome To Keremela Please Select a Subject To Start</div>
    </div>

    <script src="/scripts/firebase-auth.js"></script>
    <script src="/scripts/sidebar.js"></script>
    <script src="scripts/index.js"></script>

</body>
</html>
