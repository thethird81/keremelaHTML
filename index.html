<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title"></title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">


    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-auth.js"></script>

</head>
<body>
    <nav class="flex-div">
        <div class="nav-left flex-div">
            <img src="images/menu.png" class="menu-icon">
            <a href="/index.html"><img src="images/Keremela-crop2.jpg" class="logo"></a>

        </div>
        <div class="nav-middle flex-div">
            <div class="search-box flex-div">
                <input type="text" id="searchBar" placeholder="Search" />
                <!-- Search Results Dropdown -->
                <div id="searchResults" class="results-dropdown">
                    <ul id="resultsList"></ul>
                </div>
            </div>
        </div>


        <div class="nav-right flex-div">
            <span id="nickName"></span>
            <img src="images/user-icon.png" id="userIcon">
            <div class="dropdown-menu" id="dropdownMenu">
                <button id="profile">Profile</button>
                <button id="signOut">Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar">
        <div id="sidebarContent"></div>
    </div>

    <!-- Main content -->
    <div class="container">
        <div class="list-container">
            <!-- Video list will be dynamically populated here -->
        </div>
        <div id="welcomeMessage">Welcome To Keremela Please Select a Subject To Start</div>
    </div>

    <script src="/scripts/sidebar.js"></script>
    <script src="scripts/index.js"></script>
</body>
</html>
